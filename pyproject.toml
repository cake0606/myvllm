[project]
name = "myvllm"
version = "0.1.0"
description = "A small, readable vLLM-style inference engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flash-attn",
    "numpy>=1.26,<3",
    "torch>=2.4,<3",
]

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.uv]
package = true

[tool.uv.sources]
flash-attn = { git = "https://github.com/Dao-AILab/flash-attention", rev = "d16e381f6f8041422bd36f27adaf61fbf8ca872a" }

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.8.4"
requires-dist = ["einops", "torch"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["myvllm"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src/myvllm"]
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
